<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>关于我们 - 绿色家园</title>
    <link rel="stylesheet" href="../assets/styles/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header id="header"></header>
    
    <main class="section" style="padding-top: 140px;">
        <div class="container">
            <div class="section-header">
                <h2 class="section-title">关于我们</h2>
                <p class="section-desc">倡导低碳生活，守护绿水青山，共建美丽中国</p>
            </div>
            
            <div class="card" style="margin-bottom: 2rem; text-align: center;">
                <h3>我们的使命</h3>
                <p style="margin-top: 1rem;">
                    绿色家园致力于环保公益宣传，倡导低碳生活理念，推动生态文明建设。我们相信，每个人的微小行动都能汇聚成改变世界的巨大力量。
                </p>
                <p>
                    通过提供碳足迹计算、环保活动组织、日常任务打卡等功能，我们希望帮助更多人了解环保知识，养成环保习惯，共同守护我们唯一的地球家园。
                </p>
            </div>
            
            <div class="cards" style="margin-bottom: 2rem;">
                <div class="card" style="text-align: center;">
                    <div class="card-icon">
                        <i class="fas fa-eye"></i>
                    </div>
                    <h3>愿景</h3>
                    <p>成为最具影响力的环保公益平台，让绿色生活理念深入人心</p>
                </div>
                <div class="card" style="text-align: center;">
                    <div class="card-icon">
                        <i class="fas fa-heart"></i>
                    </div>
                    <h3>价值观</h3>
                    <p>环保、公益、创新、共享，用科技力量推动绿色发展</p>
                </div>
                <div class="card" style="text-align: center;">
                    <div class="card-icon">
                        <i class="fas fa-users"></i>
                    </div>
                    <h3>目标</h3>
                    <p>引导1000万人参与环保行动，减少碳排放100万吨</p>
                </div>
            </div>
            
            <div class="card" style="margin-bottom: 2rem; text-align: center;">
                <h3>联系我们</h3>
                <form id="contact-form" style="text-align: left;">
                    <div class="form-group">
                        <label for="name">姓名</label>
                        <input type="text" id="name" name="name" placeholder="请输入您的姓名">
                        <div class="error" id="name-error"></div>
                    </div>
                    <div class="form-group">
                        <label for="email">邮箱</label>
                        <input type="email" id="email" name="email" placeholder="请输入您的邮箱">
                        <div class="error" id="email-error"></div>
                    </div>
                    <div class="form-group">
                        <label for="phone">电话</label>
                        <input type="tel" id="phone" name="phone" placeholder="请输入您的电话">
                        <div class="error" id="phone-error"></div>
                    </div>
                    <div class="form-group">
                        <label for="message">留言内容</label>
                        <textarea id="message" name="message" placeholder="请输入您的留言"></textarea>
                        <div class="error" id="message-error"></div>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%;">提交留言</button>
                </form>
                <div id="form-message"></div>
            </div>
            
            <div class="card">
                <h3>合作伙伴</h3>
                <div style="display: flex; justify-content: space-around; align-items: center; flex-wrap: wrap; gap: 2rem; margin-top: 1rem;">
                    <div style="text-align: center; padding: 1rem;">
                        <div style="font-size: 2rem; margin-bottom: 0.5rem;">🌍</div>
                        <span style="font-size: 0.9rem;">环保部</span>
                    </div>
                    <div style="text-align: center; padding: 1rem;">
                        <div style="font-size: 2rem; margin-bottom: 0.5rem;">🌱</div>
                        <span style="font-size: 0.9rem;">绿化基金会</span>
                    </div>
                    <div style="text-align: center; padding: 1rem;">
                        <div style="font-size: 2rem; margin-bottom: 0.5rem;">🚴</div>
                        <span style="font-size: 0.9rem;">骑行协会</span>
                    </div>
                    <div style="text-align: center; padding: 1rem;">
                        <div style="font-size: 2rem; margin-bottom: 0.5rem;">♻️</div>
                        <span style="font-size: 0.9rem;">垃圾分类联盟</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer id="footer"></footer>

    <script src="../components/header.js"></script>
    <script src="../components/footer.js"></script>
    <script src="../components/common.js"></script>
    <script src="../scripts/about.js"></script>
</body>
</html>
