<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日任务 - 绿色家园</title>
    <link rel="stylesheet" href="../assets/styles/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header id="header"></header>
    
    <main class="section" style="padding-top: 140px;">
        <div class="container">
            <div class="section-header">
                <h2 class="section-title">每日任务</h2>
                <p class="section-desc">完成日常环保任务，积累绿色积分成就</p>
            </div>
            
            <div class="stats-grid-vertical">
                <div class="card stats-card">
                    <h3 style="font-size: 22px; margin-bottom: 1.5rem;">📊 积分统计</h3>
                    <div class="stats-row">
                        <div class="stat-box">
                            <div class="stat-number" style="color: var(--primary);">
                                <span id="total-points">0</span>
                            </div>
                            <div class="stat-label">总积分</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-number" style="color: var(--secondary);">
                                <span id="today-points">0</span>
                            </div>
                            <div class="stat-label">今日积分</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-number" style="color: #c4a030;">
                                <span id="streak">0</span>
                            </div>
                            <div class="stat-label">连续天数</div>
                        </div>
                    </div>
                </div>
                
                <div class="card achievements-card">
                    <h3 style="font-size: 22px; margin-bottom: 1.5rem;">🏆 我的成就</h3>
                    <div id="achievements-display"></div>
                </div>
            </div>
            
            <h2 style="font-size: 32px; text-align: center; margin: 3.5rem 0 2rem; color: var(--text-dark);">✅ 今日任务</h2>
            <div id="tasks-container" class="cards"></div>
            
            <div id="calendar-section" style="margin-top: 4rem;">
                <h3 style="font-size: 28px; text-align: center; margin-bottom: 2rem; color: var(--text-dark);">📅 打卡日历</h3>
                <div class="card" style="padding: 2rem;">
                    <div id="calendar-container"></div>
                </div>
            </div>
        </div>
    </main>

    <footer id="footer"></footer>

    <script src="../components/header.js"></script>
    <script src="../components/footer.js"></script>
    <script src="../components/common.js"></script>
    <script src="../scripts/tasks.js"></script>
</body>
</html>
